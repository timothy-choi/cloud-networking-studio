name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend (pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cloud_networking_studio_test
          POSTGRES_USER: cns_user
          POSTGRES_PASSWORD: cns_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U cns_user -d cloud_networking_studio_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend tests
        env:
          DATABASE_URL: postgresql://cns_user:cns_password@localhost:5432/cloud_networking_studio_test
          CNS_USE_FAKE_DOCKER: "1"
        run: pytest tests/ -q --tb=short

  frontend-build:
    name: Frontend (production build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

  production-smoke:
    name: Production stack (compose + smoke)
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: cns-ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose -f docker-compose.prod.yml config --quiet

      - name: Start production stack
        env:
          AUTH_REQUIRE_LOGIN: "true"
        run: docker compose -f docker-compose.prod.yml up -d --build

      - name: Wait for stack (HTTP, up to 90s)
        run: bash scripts/ci_wait_for_stack.sh http://127.0.0.1 90

      - name: Production smoke tests
        env:
          CNS_BASE_URL: http://127.0.0.1
          CNS_HEAVY_SMOKE: "1"
        run: bash scripts/prod_smoke_test.sh

      - name: Print compose ps and service logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.prod.yml ps -a
          docker compose -f docker-compose.prod.yml logs --no-color --tail=250 backend frontend caddy postgres

      - name: Tear down production stack
        if: always()
        run: docker compose -f docker-compose.prod.yml down -v --remove-orphans || true
