# Production: manual deploy only (workflow_dispatch). Checks out the branch you select
# in the Actions UI (feature branches OK for pre-merge testing). Does not auto-run on
# push — use CI for every branch; merge to main when ready, then deploy manually.
# Terraform (S3, persistent EC2) → EC2 Compose (Caddy HTTPS) → smoke → Vercel.
# Does not destroy infra. See docs/CICD_DEPLOYMENT.md (Step 31: main vs PR workflows).

name: Deploy production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production-${{ github.repository }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "1"

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 90

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cloud_networking_studio_test
          POSTGRES_USER: cns_user
          POSTGRES_PASSWORD: cns_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U cns_user -d cloud_networking_studio_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Set optional Terraform variables
        run: |
          PN="${{ secrets.TF_VAR_PROJECT_NAME }}"
          EV="${{ secrets.TF_VAR_ENVIRONMENT }}"
          echo "TF_VAR_project_name=${PN:-cns}" >> "$GITHUB_ENV"
          echo "TF_VAR_environment=${EV:-prod}" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Backend tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://cns_user:cns_password@localhost:5432/cloud_networking_studio_test
          CNS_USE_FAKE_DOCKER: "1"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pytest tests/ -q --tb=short

      - name: Validate production compose files
        run: |
          set -euo pipefail
          docker compose -f docker-compose.prod.yml config --quiet
          CNS_CADDY_SITE_ADDRESS=api.example.com SSLIP_HOST=api.example.com CNS_SSLIP_HOST=api.example.com \
            docker compose -f docker-compose.prod.yml -f docker-compose.caddy-https.yml config --quiet

      - name: Require EC2 deploy secrets
        env:
          RDS_PASSWORD: ${{ secrets.RDS_PASSWORD }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          CNS_CORS_ORIGINS: ${{ secrets.CNS_CORS_ORIGINS }}
        run: |
          set -euo pipefail
          missing=()
          [[ -z "${CNS_CORS_ORIGINS:-}" ]] && missing+=(CNS_CORS_ORIGINS)
          if [[ -z "${RDS_PASSWORD:-}" ]] && [[ -z "${POSTGRES_PASSWORD:-}" ]]; then
            missing+=(RDS_PASSWORD_or_POSTGRES_PASSWORD)
          fi
          if [[ "${#missing[@]}" -gt 0 ]]; then
            echo "::error::Missing required repository secret(s): ${missing[*]}. Add them for production EC2 deploy. See docs/CICD_DEPLOYMENT.md and docs/RDS.md"
            exit 1
          fi
          echo "Required EC2 deploy secrets are set (values are not printed)."

      - name: Set production API host defaults
        id: prod_api
        run: |
          set -euo pipefail
          H="api.cloudnetstudio.com"
          if [[ -n "${{ vars.CNS_PRODUCTION_API_HOST }}" ]]; then
            H="${{ vars.CNS_PRODUCTION_API_HOST }}"
          fi
          # Bare hostname only (repo var may include https:// or a path; avoids broken http_origin like http://https://…).
          H="${H#https://}"
          H="${H#http://}"
          H="${H%%/*}"
          if [[ -z "${H}" ]]; then
            H="api.cloudnetstudio.com"
          fi
          echo "api_host=${H}" >> "$GITHUB_OUTPUT"
          echo "http_origin=http://${H}" >> "$GITHUB_OUTPUT"
          echo "https_origin=https://${H}" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js (frontend)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"
          terraform_wrapper: false

      - name: Terraform apply infrastructure
        id: tf
        working-directory: infra/terraform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
          TF_VAR_key_name: ${{ secrets.TF_VAR_KEY_NAME }}
          TF_VAR_ssh_allowed_cidr: ${{ secrets.TF_VAR_SSH_ALLOWED_CIDR }}
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_STATE_KEY: ${{ secrets.TF_STATE_KEY }}
          TF_STATE_DYNAMODB_TABLE: ${{ secrets.TF_STATE_DYNAMODB_TABLE }}
          # Partial S3 backend: inject backend file path into init (init line stays `terraform init -input=false -reconfigure`).
          TF_CLI_ARGS_init: "-backend-config=backend.ci.hcl"
          TF_VAR_rds_enabled: ${{ vars.RDS_ENABLED == 'true' && 'true' || 'false' }}
          TF_VAR_rds_master_password: ${{ secrets.RDS_PASSWORD || secrets.POSTGRES_PASSWORD }}
        run: |
          # Terraform commands must stay in this single block so backend init is guaranteed before plan/apply.
          set -euo pipefail
          terraform version
          rm -rf .terraform
          if [[ -z "${TF_STATE_BUCKET:-}" ]]; then
            echo "::error::Set repository secret TF_STATE_BUCKET (S3). See docs/CICD_DEPLOYMENT.md"
            exit 1
          fi
          KEY="${TF_STATE_KEY:-cloud-networking-studio/prod/terraform.tfstate}"
          {
            echo "bucket  = \"${TF_STATE_BUCKET}\""
            echo "key     = \"${KEY}\""
            echo "region  = \"${AWS_REGION}\""
            echo "encrypt = true"
          } > backend.ci.hcl
          if [[ -n "${TF_STATE_DYNAMODB_TABLE:-}" ]]; then
            echo "dynamodb_table = \"${TF_STATE_DYNAMODB_TABLE}\"" >> backend.ci.hcl
          fi
          terraform init -input=false -reconfigure
          terraform fmt -check -recursive
          terraform validate
          terraform plan -input=false -out=tfplan
          terraform apply -input=false -auto-approve tfplan
          echo "public_ip=$(terraform output -raw public_ip)" >> "$GITHUB_OUTPUT"
          echo "sslip_host=$(terraform output -raw sslip_host)" >> "$GITHUB_OUTPUT"
          echo "stack_base_url_sslip=$(terraform output -raw stack_base_url_sslip)" >> "$GITHUB_OUTPUT"
          echo "stack_base_url_sslip_http=$(terraform output -raw stack_base_url_sslip_http)" >> "$GITHUB_OUTPUT"
          echo "api_base_url_sslip=$(terraform output -raw api_base_url_sslip)" >> "$GITHUB_OUTPUT"
          echo "api_base_url_sslip_http=$(terraform output -raw api_base_url_sslip_http)" >> "$GITHUB_OUTPUT"
          echo "rds_address=$(terraform output -raw rds_address)" >> "$GITHUB_OUTPUT"
          echo "rds_port=$(terraform output -raw rds_port)" >> "$GITHUB_OUTPUT"
          echo "rds_database_name=$(terraform output -raw rds_database_name)" >> "$GITHUB_OUTPUT"
          echo "rds_username=$(terraform output -raw rds_username)" >> "$GITHUB_OUTPUT"

      - name: Wait for SSH
        env:
          IP: ${{ steps.tf.outputs.public_ip }}
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if (command -v nc >/dev/null 2>&1 && nc -zvw2 "$IP" 22) || timeout 3 bash -c "echo >/dev/tcp/${IP}/22" 2>/dev/null; then
              echo "SSH ready"
              exit 0
            fi
            echo "Waiting for SSH... (${i}/30)"
            sleep 10
          done
          echo "::error::SSH did not become ready"
          exit 1

      - name: Deploy Docker stack on EC2 (Caddy HTTPS on custom API domain)
        uses: appleboy/ssh-action@v1.1.0
        env:
          POSTGRES_PASSWORD: ${{ secrets.RDS_PASSWORD || secrets.POSTGRES_PASSWORD }}
          CNS_CORS_ORIGINS: ${{ secrets.CNS_CORS_ORIGINS }}
          CNS_CADDY_SITE_ADDRESS: ${{ steps.prod_api.outputs.api_host }}
          CNS_CADDY_AUTO_HTTPS: "on"
          CADDYFILE_CADDY: "./deploy/Caddyfile.public-https"
          CNS_ENVIRONMENT: "production"
          CNS_CONTROLLER_MODE: "manual"
          RDS_ENDPOINT: ${{ steps.tf.outputs.rds_address }}
          RDS_PORT: ${{ steps.tf.outputs.rds_port }}
          RDS_DATABASE_NAME: ${{ steps.tf.outputs.rds_database_name }}
          RDS_USERNAME: ${{ steps.tf.outputs.rds_username }}
          RDS_PASSWORD: ${{ secrets.RDS_PASSWORD }}
          CNS_LEGACY_SSLIP_HTTP: ${{ steps.tf.outputs.stack_base_url_sslip_http }}
          # Production stack: FastAPI -> Go runner -> Docker (not local kind/kubernetes).
          RUNTIME_EXECUTOR: "go"
          RUNTIME_PROVIDER: "docker"
          GO_RUNNER_URL: "http://runner:8090"
          AUTH_SECRET_KEY: ${{ secrets.AUTH_SECRET_KEY }}
        with:
          host: ${{ steps.tf.outputs.public_ip }}
          username: ${{ secrets.EC2_SSH_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          envs: POSTGRES_PASSWORD,RDS_PASSWORD,CNS_CORS_ORIGINS,CNS_CADDY_SITE_ADDRESS,CNS_CADDY_AUTO_HTTPS,CNS_ENVIRONMENT,CNS_CONTROLLER_MODE,CADDYFILE_CADDY,RDS_ENDPOINT,RDS_PORT,RDS_DATABASE_NAME,RDS_USERNAME,CNS_LEGACY_SSLIP_HTTP,RUNTIME_EXECUTOR,RUNTIME_PROVIDER,GO_RUNNER_URL,AUTH_SECRET_KEY
          script_stop: true
          script: |
            #!/usr/bin/env bash
            set -euo pipefail
            sudo cloud-init status --wait || true
            echo "=== cloud-init status ==="
            sudo cloud-init status || true

            ensure_docker() {
              if command -v docker >/dev/null 2>&1; then
                :
              else
                export DEBIAN_FRONTEND=noninteractive
                sudo apt-get update -y
                sudo apt-get install -y ca-certificates curl gnupg git jq openssl
                sudo install -m 0755 -d /etc/apt/keyrings
                curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --batch --yes --dearmor -o /etc/apt/keyrings/docker.gpg
                sudo chmod a+r /etc/apt/keyrings/docker.gpg
                . /etc/os-release
                echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu ${VERSION_CODENAME} stable" | sudo tee /etc/apt/sources.list.d/docker.list >/dev/null
                sudo apt-get update -y
                sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
                sudo systemctl enable docker
                sudo systemctl start docker
                sudo usermod -aG docker "${USER}" || true
              fi
              if ! command -v openssl >/dev/null 2>&1; then
                export DEBIAN_FRONTEND=noninteractive
                sudo apt-get update -y
                sudo apt-get install -y openssl
              fi
            }

            ensure_docker
            docker --version 2>/dev/null || sudo docker --version
            docker compose version 2>/dev/null || sudo docker compose version

            # xtrace off: clone URL and .env contain secrets (token, DB password, CORS).
            set +x
            echo "=== git clone / fetch / checkout (xtrace off — secrets) ==="
            REPO_DIR="${HOME}/cloud-networking-studio"
            REPO_SLUG="${{ github.repository }}"
            GIT_SHA="${{ github.sha }}"
            TOKEN="${{ github.token }}"
            CLONE_URL="https://x-access-token:${TOKEN}@github.com/${REPO_SLUG}.git"
            if [[ ! -d "${REPO_DIR}/.git" ]]; then
              git clone "${CLONE_URL}" "${REPO_DIR}"
            fi
            cd "${REPO_DIR}"
            git remote set-url origin "${CLONE_URL}"
            git fetch origin
            git checkout "${GIT_SHA}"
            git rev-parse HEAD
            git status --short || true

            echo "=== write .env (values not printed) ==="

            echo "POSTGRES_PASSWORD present? $([[ -n "${POSTGRES_PASSWORD:-}" ]] && echo yes || echo no)"
            echo "RDS_PASSWORD present? $([[ -n "${RDS_PASSWORD:-}" ]] && echo yes || echo no)"
            echo "RDS_ENDPOINT present? $([[ -n "${RDS_ENDPOINT:-}" ]] && echo yes || echo no)"
            echo "CNS_CORS_ORIGINS present? $([[ -n "${CNS_CORS_ORIGINS:-}" ]] && echo yes || echo no)"
            echo "AUTH_SECRET_KEY present? $([[ -n "${AUTH_SECRET_KEY:-}" ]] && echo yes || echo no)"

            gen_secret_hex() {
              if command -v openssl >/dev/null 2>&1; then
                openssl rand -hex 32
              elif command -v python3 >/dev/null 2>&1; then
                python3 -c 'import secrets; print(secrets.token_hex(32))'
              else
                ( set +o pipefail; LC_ALL=C tr -dc 'a-f0-9' </dev/urandom | head -c 64 )
              fi
            }

            AUTH_SECRET_KEY="$(printf '%s' "${AUTH_SECRET_KEY:-}" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            if [[ -z "${AUTH_SECRET_KEY}" ]] && [[ -f .env ]]; then
              AUTH_SECRET_KEY="$(grep -E '^AUTH_SECRET_KEY=' .env | tail -n1 | cut -d= -f2- || true)"
              AUTH_SECRET_KEY="$(printf '%s' "${AUTH_SECRET_KEY}" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            fi
            CNS_DEV_AUTH_DEFAULT="local-dev-only-change-AUTH_SECRET_KEY-in-production-min-32-chars"
            if [[ -z "${AUTH_SECRET_KEY}" ]] || [[ "${AUTH_SECRET_KEY}" == "${CNS_DEV_AUTH_DEFAULT}" ]]; then
              AUTH_SECRET_KEY="$(gen_secret_hex)"
            fi
            if [[ -z "${AUTH_SECRET_KEY}" ]] || [[ ${#AUTH_SECRET_KEY} -lt 32 ]]; then
              echo "::error::SSH deploy: AUTH_SECRET_KEY material was empty or too short after resolution."
              exit 1
            fi

            PUB_HOST="$(printf '%s' "${CNS_CADDY_SITE_ADDRESS:-}" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            if [[ -z "${PUB_HOST}" ]]; then
              echo "::error::SSH deploy: CNS_CADDY_SITE_ADDRESS empty after trim."
              exit 1
            fi
            if [[ -z "${POSTGRES_PASSWORD:-}" ]] || [[ -z "${CNS_CORS_ORIGINS:-}" ]]; then
              echo "::error::SSH deploy: POSTGRES_PASSWORD or CNS_CORS_ORIGINS empty on remote."
              exit 1
            fi

            CNS_REQUIRED_CORS_ORIGINS="https://app.cloudnetstudio.com,http://${PUB_HOST},https://${PUB_HOST}"
            if [[ -n "${CNS_LEGACY_SSLIP_HTTP:-}" ]]; then
              CNS_REQUIRED_CORS_ORIGINS="${CNS_REQUIRED_CORS_ORIGINS},${CNS_LEGACY_SSLIP_HTTP}"
            fi
            CNS_CORS_ORIGINS="${CNS_CORS_ORIGINS},${CNS_REQUIRED_CORS_ORIGINS}"

            CNS_CADDY_SITE_ADDRESS="${PUB_HOST}"
            CNS_CADDY_AUTO_HTTPS="${CNS_CADDY_AUTO_HTTPS:-on}"
            CADDYFILE_CADDY="${CADDYFILE_CADDY:-./deploy/Caddyfile.public-https}"

            # Production default: control plane delegates to cns-runner; runner uses Docker only.
            RUNTIME_EXECUTOR="${RUNTIME_EXECUTOR:-go}"
            RUNTIME_PROVIDER="${RUNTIME_PROVIDER:-docker}"
            GO_RUNNER_URL="${GO_RUNNER_URL:-http://runner:8090}"

            RDS_EP="$(printf '%s' "${RDS_ENDPOINT:-}" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            RDS_P="$(printf '%s' "${RDS_PORT:-}" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            if [[ -z "${RDS_P}" ]]; then RDS_P="5432"; fi
            RDS_USER="$(printf '%s' "${RDS_USERNAME:-cns_user}" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            RDS_DB="$(printf '%s' "${RDS_DATABASE_NAME:-cloud_networking_studio}" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"

            DATABASE_URL=""

            if [[ -n "${RDS_EP}" ]] && command -v python3 >/dev/null 2>&1; then
              export _CNS_PY_HOST="${RDS_EP}"
              export _CNS_PY_PORT="${RDS_P}"
              export _CNS_PY_USER="${RDS_USER}"
              export _CNS_PY_DB="${RDS_DB}"
              export _CNS_PY_PW="${POSTGRES_PASSWORD}"
              set +e
              PYOUT="$(python3 -c 'import os,urllib.parse as u;h=os.environ["_CNS_PY_HOST"].strip();pt=(os.environ.get("_CNS_PY_PORT") or "5432").strip() or "5432";user=u.quote(os.environ["_CNS_PY_USER"].strip(),safe="");pw=u.quote(os.environ["_CNS_PY_PW"],safe="");db=os.environ["_CNS_PY_DB"].strip();print("postgresql://"+user+":"+pw+"@"+h+":"+pt+"/"+db)' 2>/dev/null)"
              PYRC=$?
              set -e
              unset _CNS_PY_HOST _CNS_PY_PORT _CNS_PY_USER _CNS_PY_DB _CNS_PY_PW || true
              if [[ "${PYRC}" -eq 0 ]] && [[ -n "${PYOUT}" ]]; then
                DATABASE_URL="${PYOUT}"
              else
                echo "::warning::Could not build RDS DATABASE_URL (python rc=${PYRC}); using Docker Postgres service."
              fi
            elif [[ -n "${RDS_EP}" ]]; then
              echo "::warning::RDS_ENDPOINT set but python3 not found; using Docker Postgres service."
            fi

            if [[ -z "${DATABASE_URL}" ]]; then
              DATABASE_URL="postgresql://cns_user:${POSTGRES_PASSWORD}@postgres:5432/cloud_networking_studio"
            fi

            if [[ "${DATABASE_URL}" == *"@postgres:"* ]]; then
              DB_MODE="localdb"
            else
              DB_MODE="external"
            fi
            COMPOSE=(sudo docker compose)
            echo "database mode: ${DB_MODE}"

            C_ARGS=(-f docker-compose.prod.yml -f docker-compose.caddy-https.yml --env-file .env)

            # Caddy certs are persisted via caddy_data/caddy_config volumes (docker-compose.caddy-https.yml).
            # When CNS_CADDY_AUTO_HTTPS=on, never run `docker compose down -v`: it removes those volumes and
            # forces fresh Let's Encrypt issuances (rate limits).
            run_compose() {
              if [[ "${CNS_CADDY_AUTO_HTTPS:-}" == "on" ]]; then
                local saw_down=0 i arg
                for ((i=1; i<=$#; i++)); do
                  if [[ "${!i}" == "down" ]]; then
                    saw_down=1
                  fi
                done
                if [[ "${saw_down}" -eq 1 ]]; then
                  for ((i=1; i<=$#; i++)); do
                    arg="${!i}"
                    if [[ "${arg}" == "-v" ]] || [[ "${arg}" == "--volumes" ]]; then
                      echo "::error::Refusing docker compose down with volume removal (-v/--volumes) when CNS_CADDY_AUTO_HTTPS=on (deletes caddy_data/caddy_config; new LE certs → rate limits). Use docker compose down without -v/--volumes. See docs/CICD_DEPLOYMENT.md."
                      exit 1
                    fi
                  done
                fi
              fi
              "${COMPOSE[@]}" "$@"
            }

            umask 077
            {
              printf '%s\n' \
                "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}" \
                "CNS_CORS_ORIGINS=${CNS_CORS_ORIGINS}" \
                "CNS_ENVIRONMENT=${CNS_ENVIRONMENT:-production}" \
                "CNS_CONTROLLER_MODE=${CNS_CONTROLLER_MODE:-manual}" \
                "CNS_CADDY_SITE_ADDRESS=${CNS_CADDY_SITE_ADDRESS}" \
                "CNS_CADDY_AUTO_HTTPS=${CNS_CADDY_AUTO_HTTPS}" \
                "DATABASE_URL=${DATABASE_URL}" \
                "SSLIP_HOST=${PUB_HOST}" \
                "CNS_SSLIP_HOST=${PUB_HOST}" \
                "CADDYFILE_CADDY=${CADDYFILE_CADDY}" \
                "AUTH_REQUIRE_LOGIN=true" \
                "AUTH_SECRET_KEY=${AUTH_SECRET_KEY}" \
                "RUNTIME_EXECUTOR=${RUNTIME_EXECUTOR}" \
                "RUNTIME_PROVIDER=${RUNTIME_PROVIDER}" \
                "GO_RUNNER_URL=${GO_RUNNER_URL}"
            } > .env
            echo "=== .env written ==="
            cut -d= -f1 .env
            echo "=== runtime vars in .env ==="
            grep -E '^(RUNTIME_EXECUTOR|RUNTIME_PROVIDER|GO_RUNNER_URL)=' .env || true

            unset TOKEN CLONE_URL POSTGRES_PASSWORD RDS_PASSWORD CNS_CORS_ORIGINS CNS_LEGACY_SSLIP_HTTP DATABASE_URL RDS_ENDPOINT RDS_PORT RDS_DATABASE_NAME RDS_USERNAME AUTH_SECRET_KEY || true
            set -x

            echo "=== docker compose config ==="
            if ! run_compose "${C_ARGS[@]}" config; then
              echo "=== docker compose ps (after failed config) ==="
              run_compose "${C_ARGS[@]}" ps -a || true
              echo "=== docker compose logs (after failed config, tail=120) ==="
              run_compose "${C_ARGS[@]}" logs --tail=120 || true
              exit 1
            fi

            # Caddy certs are persisted via caddy_data/caddy_config volumes — down without -v only.
            echo "=== docker compose down (no -v: keeps postgres_data, caddy_data, caddy_config) ==="
            run_compose "${C_ARGS[@]}" down || true

            echo "=== docker compose up -d --build --remove-orphans ==="
            if ! run_compose "${C_ARGS[@]}" up -d --build --remove-orphans; then
              echo "=== docker compose ps (after failed up) ==="
              run_compose "${C_ARGS[@]}" ps -a || true
              echo "=== docker compose logs (after failed up, tail=120) ==="
              run_compose "${C_ARGS[@]}" logs --tail=120 || true
              exit 1
            fi

            echo "=== docker volume ls (caddy TLS volumes — never docker volume rm in production) ==="
            sudo docker volume ls | grep -i caddy || true

            echo "=== docker compose ps ==="
            run_compose "${C_ARGS[@]}" ps

            echo "=== alembic upgrade head (before smoke / health gate) ==="
            if ! run_compose "${C_ARGS[@]}" exec -T backend alembic upgrade head; then
              echo "=== docker compose logs backend (after failed alembic, tail=120) ==="
              run_compose "${C_ARGS[@]}" logs backend --tail=120 || true
              exit 1
            fi

            echo "=== runner RUNTIME_PROVIDER (container env) ==="
            run_compose "${C_ARGS[@]}" exec -T runner env | grep RUNTIME_PROVIDER || true

            echo "=== backend runtime executor (container env) ==="
            run_compose "${C_ARGS[@]}" exec -T backend env | grep -E 'RUNTIME_EXECUTOR|GO_RUNNER_URL' || true

            echo "=== docker compose logs caddy (tail=80) ==="
            run_compose "${C_ARGS[@]}" logs caddy --tail=80 || true

            echo "=== EC2-local backend /health (debug fallback — blocking check is runner HTTPS prod_smoke_test.sh) ==="
            EC2_LOCAL_OK=0
            for attempt in $(seq 1 30); do
              if run_compose "${C_ARGS[@]}" exec -T backend python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()" >/dev/null 2>&1; then
                echo "EC2-local backend /health OK (attempt ${attempt})"
                EC2_LOCAL_OK=1
                break
              fi
              echo "Waiting for backend /health on EC2 (attempt ${attempt}/30)..."
              sleep 2
            done
            if [[ "${EC2_LOCAL_OK}" -ne 1 ]]; then
              echo "::warning::EC2-local backend /health failed (non-blocking). GitHub runner prod_smoke_test.sh against HTTPS is authoritative."
              run_compose "${C_ARGS[@]}" ps -a || true
              run_compose "${C_ARGS[@]}" logs backend --tail=80 || true
            fi

      - name: Production smoke (HTTPS API)
        env:
          CNS_BASE_URL: https://api.cloudnetstudio.com
          CNS_SMOKE_API_ONLY: "1"
        run: bash scripts/prod_smoke_test.sh

      - name: Verify HTTP API (/api/health, best effort — public may 308 to HTTPS)
        continue-on-error: true
        run: |
          set -euo pipefail
          if curl -sfS --connect-timeout 20 --max-time 90 "${{ steps.prod_api.outputs.http_origin }}/api/health" | jq -e '.status' >/dev/null 2>&1; then
            echo "Public HTTP /api/health OK"
          else
            echo "::warning::Public HTTP /api/health check failed (often 308→HTTPS). Blocking check is HTTPS prod_smoke_test.sh."
          fi

      - name: Verify HTTPS API (/api/health)
        run: |
          set -euo pipefail
          URL="${{ steps.prod_api.outputs.https_origin }}/api/health"
          curl -sfS --connect-timeout 25 --max-time 90 "$URL" | jq -e '.status'
          echo "HTTPS /api/health OK"

      - name: Deploy to Vercel
        shell: bash
        env:
          SHELL: /bin/bash
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VITE_API_BASE_URL: ${{ secrets.VERCEL_VITE_API_BASE_URL }}
          PROD_VITE_API_DEFAULT: ${{ steps.prod_api.outputs.https_origin }}/api
        run: |
          set -euo pipefail
          export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:${PATH:-}"
          API_BASE_URL="${VITE_API_BASE_URL:-$PROD_VITE_API_DEFAULT}"
          cd frontend
          echo "=== pwd ==="
          pwd
          npm ci
          npx vercel@54.0.0 pull --yes --environment=production --token "${VERCEL_TOKEN}"
          VITE_API_BASE_URL="${API_BASE_URL}" npm run build
          echo "=== ls -la ==="
          ls -la
          echo "=== ls -la dist ==="
          ls -la dist
          npx vercel@54.0.0 deploy --prod --yes --token "${VERCEL_TOKEN}"
