# Production: manual deploy only (workflow_dispatch). Checks out the branch you select
# in the Actions UI (feature branches OK for pre-merge testing). Does not auto-run on
# push — use CI for every branch; merge to main when ready, then deploy manually.
# Terraform (S3, persistent EC2) → EC2 Compose (Caddy HTTPS) → smoke → Vercel.
# Does not destroy infra. See docs/CICD_DEPLOYMENT.md (Step 31: main vs PR workflows).

name: Deploy production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production-${{ github.repository }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "1"

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 90

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cloud_networking_studio_test
          POSTGRES_USER: cns_user
          POSTGRES_PASSWORD: cns_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U cns_user -d cloud_networking_studio_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Set optional Terraform variables
        run: |
          PN="${{ secrets.TF_VAR_PROJECT_NAME }}"
          EV="${{ secrets.TF_VAR_ENVIRONMENT }}"
          echo "TF_VAR_project_name=${PN:-cns}" >> "$GITHUB_ENV"
          echo "TF_VAR_environment=${EV:-prod}" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Backend tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://cns_user:cns_password@localhost:5432/cloud_networking_studio_test
          CNS_USE_FAKE_DOCKER: "1"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pytest tests/ -q --tb=short

      - name: Validate production compose files
        run: |
          set -euo pipefail
          docker compose -f docker-compose.prod.yml config --quiet
          GOOGLE_APPLICATION_CREDENTIALS=/opt/cns/secrets/gcp-terraform-sa.json \
            CNS_REMOTE_DOCKER_SSH_KEY_PATH=/opt/cns/secrets/gcp-remote-docker-key \
            CNS_REMOTE_DOCKER_SSH_PUBLIC_KEY_PATH=/opt/cns/secrets/gcp-remote-docker-key.pub \
            CNS_CADDY_SITE_ADDRESS=api.example.com SSLIP_HOST=api.example.com CNS_SSLIP_HOST=api.example.com \
            docker compose -f docker-compose.prod.yml -f docker-compose.caddy-https.yml config --quiet
          python3 - <<'PY'
          from pathlib import Path

          prod = Path("docker-compose.prod.yml").read_text()
          assert prod.count("/opt/cns/secrets:/opt/cns/secrets:ro") >= 2
          backend_idx = prod.index("  backend:")
          runner_idx = prod.index("  runner:")
          frontend_idx = prod.index("  frontend:")
          runner_block = prod[runner_idx:backend_idx]
          backend_block = prod[backend_idx:frontend_idx]
          gcp_default = "GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-/opt/cns/secrets/gcp-terraform-sa.json}"
          ssh_default = "CNS_REMOTE_DOCKER_SSH_KEY_PATH: ${CNS_REMOTE_DOCKER_SSH_KEY_PATH:-/opt/cns/secrets/gcp-remote-docker-key}"
          pub_default = "CNS_REMOTE_DOCKER_SSH_PUBLIC_KEY_PATH: ${CNS_REMOTE_DOCKER_SSH_PUBLIC_KEY_PATH:-/opt/cns/secrets/gcp-remote-docker-key.pub}"
          for block, name in ((backend_block, "backend"), (runner_block, "runner")):
              assert gcp_default in block, name
              assert ssh_default in block, name
              assert pub_default in block, name
              assert "/opt/cns/secrets:/opt/cns/secrets:ro" in block, name
          prod_script = Path("scripts/prod_deploy_remote.sh").read_text()
          cred_script = Path("scripts/infra_deployment_credentials.sh").read_text()
          assert "infra_deployment_credentials.sh" in prod_script
          assert "ensure_infra_deployment_credential_env_lines" in cred_script
          assert "verify_host_infra_credential_files" in cred_script
          print("production compose + deploy scripts: GCP infra credentials wiring OK")
          PY

      - name: Require EC2 deploy secrets
        env:
          RDS_PASSWORD: ${{ secrets.RDS_PASSWORD }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          CNS_CORS_ORIGINS: ${{ secrets.CNS_CORS_ORIGINS }}
        run: |
          set -euo pipefail
          missing=()
          [[ -z "${CNS_CORS_ORIGINS:-}" ]] && missing+=(CNS_CORS_ORIGINS)
          if [[ -z "${RDS_PASSWORD:-}" ]] && [[ -z "${POSTGRES_PASSWORD:-}" ]]; then
            missing+=(RDS_PASSWORD_or_POSTGRES_PASSWORD)
          fi
          if [[ "${#missing[@]}" -gt 0 ]]; then
            echo "::error::Missing required repository secret(s): ${missing[*]}. Add them for production EC2 deploy. See docs/CICD_DEPLOYMENT.md and docs/RDS.md"
            exit 1
          fi
          echo "Required EC2 deploy secrets are set (values are not printed)."

      - name: Set production API host defaults
        id: prod_api
        run: |
          set -euo pipefail
          H="api.cloudnetstudio.com"
          if [[ -n "${{ vars.CNS_PRODUCTION_API_HOST }}" ]]; then
            H="${{ vars.CNS_PRODUCTION_API_HOST }}"
          fi
          # Bare hostname only (repo var may include https:// or a path; avoids broken http_origin like http://https://…).
          H="${H#https://}"
          H="${H#http://}"
          H="${H%%/*}"
          if [[ -z "${H}" ]]; then
            H="api.cloudnetstudio.com"
          fi
          echo "api_host=${H}" >> "$GITHUB_OUTPUT"
          echo "http_origin=http://${H}" >> "$GITHUB_OUTPUT"
          echo "https_origin=https://${H}" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js (frontend)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"
          terraform_wrapper: false

      - name: Terraform apply infrastructure
        id: tf
        working-directory: infra/terraform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
          TF_VAR_key_name: ${{ secrets.TF_VAR_KEY_NAME }}
          TF_VAR_ssh_allowed_cidr: ${{ secrets.TF_VAR_SSH_ALLOWED_CIDR }}
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_STATE_KEY: ${{ secrets.TF_STATE_KEY }}
          TF_STATE_DYNAMODB_TABLE: ${{ secrets.TF_STATE_DYNAMODB_TABLE }}
          # Partial S3 backend: inject backend file path into init (init line stays `terraform init -input=false -reconfigure`).
          TF_CLI_ARGS_init: "-backend-config=backend.ci.hcl"
          TF_VAR_rds_enabled: ${{ vars.RDS_ENABLED == 'true' && 'true' || 'false' }}
          TF_VAR_rds_master_password: ${{ secrets.RDS_PASSWORD || secrets.POSTGRES_PASSWORD }}
        run: |
          # Terraform commands must stay in this single block so backend init is guaranteed before plan/apply.
          set -euo pipefail
          terraform version
          rm -rf .terraform
          if [[ -z "${TF_STATE_BUCKET:-}" ]]; then
            echo "::error::Set repository secret TF_STATE_BUCKET (S3). See docs/CICD_DEPLOYMENT.md"
            exit 1
          fi
          KEY="${TF_STATE_KEY:-cloud-networking-studio/prod/terraform.tfstate}"
          {
            echo "bucket  = \"${TF_STATE_BUCKET}\""
            echo "key     = \"${KEY}\""
            echo "region  = \"${AWS_REGION}\""
            echo "encrypt = true"
          } > backend.ci.hcl
          if [[ -n "${TF_STATE_DYNAMODB_TABLE:-}" ]]; then
            echo "dynamodb_table = \"${TF_STATE_DYNAMODB_TABLE}\"" >> backend.ci.hcl
          fi
          terraform init -input=false -reconfigure
          terraform fmt -check -recursive
          terraform validate
          terraform plan -input=false -out=tfplan
          terraform apply -input=false -auto-approve tfplan
          echo "public_ip=$(terraform output -raw public_ip)" >> "$GITHUB_OUTPUT"
          echo "sslip_host=$(terraform output -raw sslip_host)" >> "$GITHUB_OUTPUT"
          echo "stack_base_url_sslip=$(terraform output -raw stack_base_url_sslip)" >> "$GITHUB_OUTPUT"
          echo "stack_base_url_sslip_http=$(terraform output -raw stack_base_url_sslip_http)" >> "$GITHUB_OUTPUT"
          echo "api_base_url_sslip=$(terraform output -raw api_base_url_sslip)" >> "$GITHUB_OUTPUT"
          echo "api_base_url_sslip_http=$(terraform output -raw api_base_url_sslip_http)" >> "$GITHUB_OUTPUT"
          echo "rds_address=$(terraform output -raw rds_address)" >> "$GITHUB_OUTPUT"
          echo "rds_port=$(terraform output -raw rds_port)" >> "$GITHUB_OUTPUT"
          echo "rds_database_name=$(terraform output -raw rds_database_name)" >> "$GITHUB_OUTPUT"
          echo "rds_username=$(terraform output -raw rds_username)" >> "$GITHUB_OUTPUT"

      - name: Wait for SSH
        env:
          IP: ${{ steps.tf.outputs.public_ip }}
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if (command -v nc >/dev/null 2>&1 && nc -zvw2 "$IP" 22) || timeout 3 bash -c "echo >/dev/tcp/${IP}/22" 2>/dev/null; then
              echo "SSH ready"
              exit 0
            fi
            echo "Waiting for SSH... (${i}/30)"
            sleep 10
          done
          echo "::error::SSH did not become ready"
          exit 1

      - name: Deploy Docker stack on EC2 (Caddy HTTPS on custom API domain)
        uses: appleboy/ssh-action@v1.1.0
        env:
          GIT_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          POSTGRES_PASSWORD: ${{ secrets.RDS_PASSWORD || secrets.POSTGRES_PASSWORD }}
          CNS_CORS_ORIGINS: ${{ secrets.CNS_CORS_ORIGINS }}
          CNS_CADDY_SITE_ADDRESS: ${{ steps.prod_api.outputs.api_host }}
          CNS_CADDY_AUTO_HTTPS: "on"
          CADDYFILE_CADDY: "./deploy/Caddyfile.public-https"
          CNS_ENVIRONMENT: "production"
          CNS_CONTROLLER_MODE: "manual"
          RDS_ENDPOINT: ${{ steps.tf.outputs.rds_address }}
          RDS_PORT: ${{ steps.tf.outputs.rds_port }}
          RDS_DATABASE_NAME: ${{ steps.tf.outputs.rds_database_name }}
          RDS_USERNAME: ${{ steps.tf.outputs.rds_username }}
          RDS_PASSWORD: ${{ secrets.RDS_PASSWORD }}
          CNS_LEGACY_SSLIP_HTTP: ${{ steps.tf.outputs.stack_base_url_sslip_http }}
          RUNTIME_EXECUTOR: "go"
          RUNTIME_PROVIDER: "docker"
          GO_RUNNER_URL: "http://runner:8090"
          AUTH_SECRET_KEY: ${{ secrets.AUTH_SECRET_KEY }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ vars.CNS_PRODUCTION_GCP_TERRAFORM_CREDS_PATH || '/opt/cns/secrets/gcp-terraform-sa.json' }}
          CNS_REMOTE_DOCKER_SSH_KEY_PATH: ${{ vars.CNS_REMOTE_DOCKER_SSH_KEY_PATH || '/opt/cns/secrets/gcp-remote-docker-key' }}
          CNS_REMOTE_DOCKER_SSH_PUBLIC_KEY_PATH: ${{ vars.CNS_REMOTE_DOCKER_SSH_PUBLIC_KEY_PATH || '/opt/cns/secrets/gcp-remote-docker-key.pub' }}
        with:
          host: ${{ steps.tf.outputs.public_ip }}
          username: ${{ secrets.EC2_SSH_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          envs: GIT_SHA,GITHUB_REPOSITORY,GITHUB_TOKEN,POSTGRES_PASSWORD,RDS_PASSWORD,CNS_CORS_ORIGINS,CNS_CADDY_SITE_ADDRESS,CNS_CADDY_AUTO_HTTPS,CNS_ENVIRONMENT,CNS_CONTROLLER_MODE,CADDYFILE_CADDY,RDS_ENDPOINT,RDS_PORT,RDS_DATABASE_NAME,RDS_USERNAME,CNS_LEGACY_SSLIP_HTTP,RUNTIME_EXECUTOR,RUNTIME_PROVIDER,GO_RUNNER_URL,AUTH_SECRET_KEY,GOOGLE_APPLICATION_CREDENTIALS,CNS_REMOTE_DOCKER_SSH_KEY_PATH,CNS_REMOTE_DOCKER_SSH_PUBLIC_KEY_PATH
          script_stop: true
          script: |
            set -euo pipefail
            curl -fsSL -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GIT_SHA}/scripts/prod_deploy_remote.sh" \
              -o /tmp/prod_deploy_remote.sh
            chmod +x /tmp/prod_deploy_remote.sh
            bash /tmp/prod_deploy_remote.sh

      - name: Production smoke (HTTPS API)
        env:
          CNS_BASE_URL: https://api.cloudnetstudio.com
          CNS_SMOKE_API_ONLY: "1"
        run: bash scripts/prod_smoke_test.sh

      - name: Verify HTTP API (/api/health, best effort — public may 308 to HTTPS)
        continue-on-error: true
        run: |
          set -euo pipefail
          if curl -sfS --connect-timeout 20 --max-time 90 "${{ steps.prod_api.outputs.http_origin }}/api/health" | jq -e '.status' >/dev/null 2>&1; then
            echo "Public HTTP /api/health OK"
          else
            echo "::warning::Public HTTP /api/health check failed (often 308→HTTPS). Blocking check is HTTPS prod_smoke_test.sh."
          fi

      - name: Verify HTTPS API (/api/health)
        run: |
          set -euo pipefail
          URL="${{ steps.prod_api.outputs.https_origin }}/api/health"
          curl -sfS --connect-timeout 25 --max-time 90 "$URL" | jq -e '.status'
          echo "HTTPS /api/health OK"

      - name: Deploy to Vercel
        shell: bash
        env:
          SHELL: /bin/bash
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VITE_API_BASE_URL: ${{ secrets.VERCEL_VITE_API_BASE_URL }}
          PROD_VITE_API_DEFAULT: ${{ steps.prod_api.outputs.https_origin }}/api
        run: |
          set -euo pipefail
          export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:${PATH:-}"
          API_BASE_URL="${VITE_API_BASE_URL:-$PROD_VITE_API_DEFAULT}"
          echo "=== pwd ==="
          pwd
          npm ci --prefix frontend
          npx vercel@54.0.0 pull --yes --environment=production --token "${VERCEL_TOKEN}"
          VITE_API_BASE_URL="${API_BASE_URL}" npm run build --prefix frontend
          echo "=== ls -la frontend ==="
          ls -la frontend
          echo "=== ls -la frontend/dist ==="
          ls -la frontend/dist
          npx vercel@54.0.0 deploy --prod --yes --token "${VERCEL_TOKEN}"
