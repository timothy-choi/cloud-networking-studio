# Ephemeral EC2 + Terraform apply → deploy → smoke → terraform destroy (always).
# Uses the same S3 partial backend as production; state key is per-run under TF_STATE_BUCKET.
# See docs/EPHEMERAL_CI_ENVIRONMENTS.md.

name: Ephemeral infra smoke

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ephemeral-infra-${{ github.repository }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "1"

jobs:
  ephemeral:
    name: Ephemeral Terraform and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Fork PRs do not receive repository secrets; skip expensive / unsafe no-op.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"
          terraform_wrapper: false

      - name: Terraform apply infrastructure
        id: tf
        working-directory: infra/terraform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
          TF_VAR_project_name: cns
          TF_VAR_environment: ephemeral-${{ github.run_id }}
          TF_VAR_key_name: ${{ secrets.TF_VAR_KEY_NAME }}
          # GitHub-hosted runners use dynamic egress IPs; SSH SG must allow 0.0.0.0/0 for ephemeral CI (see docs/EPHEMERAL_CI_ENVIRONMENTS.md).
          TF_VAR_ssh_allowed_cidr: "0.0.0.0/0"
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_STATE_DYNAMODB_TABLE: ${{ secrets.TF_STATE_DYNAMODB_TABLE }}
          TF_CLI_ARGS_init: "-backend-config=backend.ci.hcl"
        run: |
          # Terraform commands must stay in this single block so backend init is guaranteed before plan/apply.
          set -euxo pipefail
          pwd
          ls -la
          terraform version
          rm -rf .terraform
          if [[ -z "${TF_STATE_BUCKET:-}" ]]; then
            echo "::error::Set TF_STATE_BUCKET for ephemeral Terraform (S3 backend). See docs/EPHEMERAL_CI_ENVIRONMENTS.md"
            exit 1
          fi
          KEY="cloud-networking-studio/ephemeral/${GITHUB_RUN_ID}/terraform.tfstate"
          {
            echo "bucket  = \"${TF_STATE_BUCKET}\""
            echo "key     = \"${KEY}\""
            echo "region  = \"${AWS_REGION}\""
            echo "encrypt = true"
          } > backend.ci.hcl
          if [[ -n "${TF_STATE_DYNAMODB_TABLE:-}" ]]; then
            echo "dynamodb_table = \"${TF_STATE_DYNAMODB_TABLE}\"" >> backend.ci.hcl
          fi
          terraform init -input=false -reconfigure
          terraform validate
          terraform plan -input=false -out=tfplan
          terraform apply -input=false -auto-approve tfplan
          echo "public_ip=$(terraform output -raw public_ip)" >> "$GITHUB_OUTPUT"
          echo "sslip_host=$(terraform output -raw sslip_host)" >> "$GITHUB_OUTPUT"
          echo "stack_base_url_sslip=$(terraform output -raw stack_base_url_sslip)" >> "$GITHUB_OUTPUT"
          echo "stack_base_url_sslip_http=$(terraform output -raw stack_base_url_sslip_http)" >> "$GITHUB_OUTPUT"
          echo "api_base_url_sslip=$(terraform output -raw api_base_url_sslip)" >> "$GITHUB_OUTPUT"
          echo "api_base_url_sslip_http=$(terraform output -raw api_base_url_sslip_http)" >> "$GITHUB_OUTPUT"

      - name: Debug Terraform (pre-SSH)
        working-directory: infra/terraform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          TF_CLI_ARGS_init: "-backend-config=backend.ci.hcl"
        run: |
          set -euxo pipefail
          echo "== steps.tf.outputs.public_ip == ${{ steps.tf.outputs.public_ip }}"
          terraform output -no-color
          echo "security_group_id=$(terraform output -raw security_group_id)"
          echo "subnet_id=$(terraform output -raw subnet_id)"
          echo "vpc_id=$(terraform output -raw vpc_id)"

      - name: Wait for SSH
        env:
          IP: ${{ steps.tf.outputs.public_ip }}
        run: |
          set -euxo pipefail
          for i in $(seq 1 30); do
            if (command -v nc >/dev/null 2>&1 && nc -zvw2 "$IP" 22) || timeout 3 bash -c "echo >/dev/tcp/${IP}/22" 2>/dev/null; then
              echo "SSH ready"
              exit 0
            fi
            echo "Waiting for SSH... (${i}/30)"
            sleep 10
          done
          echo "::error::SSH did not become ready"
          exit 1

      - name: Set EC2 checkout ref
        id: ec2_ref
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            R="${{ github.event.pull_request.head.sha }}"
          else
            R="${{ github.sha }}"
          fi
          echo "ref=${R}" >> "$GITHUB_OUTPUT"
          echo "EC2 checkout ref=${R} (pull_request uses head.sha; workflow_dispatch uses github.sha)"

      - name: Build ephemeral EC2 .env (base64)
        id: eph_env
        env:
          SSLIP_HOST_RAW: ${{ steps.tf.outputs.sslip_host }}
          CNS_CADDY_SITE_ADDRESS: ":80"
          CNS_CADDY_AUTO_HTTPS: "off"
          CNS_ENVIRONMENT: "production"
          CNS_CONTROLLER_MODE: "manual"
          CADDYFILE_SSLIP: "./deploy/Caddyfile.prod"
        run: |
          set -euo pipefail
          SH="$(printf '%s' "${SSLIP_HOST_RAW}" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          if [[ -z "$SH" ]]; then
            echo "::error::Build ephemeral .env: SSLIP_HOST is empty after trim."
            exit 1
          fi
          PGP="$(openssl rand -hex 24)"
          if [[ -z "$PGP" ]]; then
            echo "::error::Build ephemeral .env: openssl rand returned empty."
            exit 1
          fi
          CONTENT="$(printf '%s\n' \
            "POSTGRES_PASSWORD=${PGP}" \
            "DATABASE_URL=postgresql://cns_user:${PGP}@postgres:5432/cloud_networking_studio" \
            "SSLIP_HOST=${SH}" \
            "CNS_CORS_ORIGINS=https://${SH},http://127.0.0.1,http://localhost" \
            "CNS_ENVIRONMENT=${CNS_ENVIRONMENT}" \
            "CNS_CONTROLLER_MODE=${CNS_CONTROLLER_MODE}" \
            "CNS_CADDY_SITE_ADDRESS=${CNS_CADDY_SITE_ADDRESS}" \
            "CNS_CADDY_AUTO_HTTPS=${CNS_CADDY_AUTO_HTTPS}" \
            "CADDYFILE_SSLIP=${CADDYFILE_SSLIP}" )"
          B64="$(printf '%s' "$CONTENT" | base64 -w0)"
          {
            echo "REMOTE_ENV_B64<<__B64_EOF"
            echo "$B64"
            echo "__B64_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Bootstrap stack on EC2
        uses: appleboy/ssh-action@v1.1.0
        env:
          REMOTE_ENV_B64: ${{ steps.eph_env.outputs.REMOTE_ENV_B64 }}
          CNS_CADDY_SITE_ADDRESS: ":80"
          CNS_CADDY_AUTO_HTTPS: "off"
          CNS_ENVIRONMENT: "production"
          CNS_CONTROLLER_MODE: "manual"
        with:
          host: ${{ steps.tf.outputs.public_ip }}
          username: ${{ secrets.EC2_SSH_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          envs: REMOTE_ENV_B64,CNS_CADDY_SITE_ADDRESS,CNS_CADDY_AUTO_HTTPS,CNS_ENVIRONMENT,CNS_CONTROLLER_MODE
          script_stop: true
          script: |
            #!/usr/bin/env bash
            set -euxo pipefail
            sudo cloud-init status --wait || true
            echo "=== cloud-init status ==="
            sudo cloud-init status || true

            ensure_docker() {
              if command -v docker >/dev/null 2>&1; then
                :
              else
                export DEBIAN_FRONTEND=noninteractive
                sudo apt-get update -y
                sudo apt-get install -y ca-certificates curl gnupg git jq openssl
                sudo install -m 0755 -d /etc/apt/keyrings
                curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --batch --yes --dearmor -o /etc/apt/keyrings/docker.gpg
                sudo chmod a+r /etc/apt/keyrings/docker.gpg
                . /etc/os-release
                echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu ${VERSION_CODENAME} stable" | sudo tee /etc/apt/sources.list.d/docker.list >/dev/null
                sudo apt-get update -y
                sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
                sudo systemctl enable docker
                sudo systemctl start docker
                sudo usermod -aG docker "${USER}" || true
              fi
              if ! command -v openssl >/dev/null 2>&1; then
                export DEBIAN_FRONTEND=noninteractive
                sudo apt-get update -y
                sudo apt-get install -y openssl
              fi
            }

            ensure_docker
            docker --version 2>/dev/null || sudo docker --version
            docker compose version 2>/dev/null || sudo docker compose version

            COMPOSE=(sudo docker compose)
            C_ARGS=(-f docker-compose.prod.yml -f docker-compose.sslip.yml --env-file .env)

            set +x
            echo "=== git clone / fetch / checkout (xtrace off — token in clone URL) ==="
            APP_DIR="${HOME}/cloud-networking-studio-ephemeral"
            REPO_SLUG="${{ github.repository }}"
            CHECKOUT_REF="${{ steps.ec2_ref.outputs.ref }}"
            TOKEN="${{ github.token }}"
            CLONE_URL="https://x-access-token:${TOKEN}@github.com/${REPO_SLUG}.git"
            rm -rf "${APP_DIR}"
            git clone "${CLONE_URL}" "${APP_DIR}"
            cd "${APP_DIR}"
            if [[ "${{ github.event_name }}" == "pull_request" ]]; then
              PR="${{ github.event.pull_request.number }}"
              git fetch origin "pull/${PR}/head:pr-${PR}" || true
              git fetch origin "${CHECKOUT_REF}" || true
              git checkout "${CHECKOUT_REF}" || git checkout "pr-${PR}"
            else
              git fetch origin "${CHECKOUT_REF}" || true
              git checkout "${CHECKOUT_REF}"
            fi
            git rev-parse HEAD
            git status --short || true

            echo "=== write .env (values not printed) ==="
            echo "REMOTE_ENV_B64 present? $([[ -n "${REMOTE_ENV_B64:-}" ]] && echo yes || echo no)"
            echo "CNS_CADDY_SITE_ADDRESS present? $([[ -n "${CNS_CADDY_SITE_ADDRESS:-}" ]] && echo yes || echo no)"
            echo "CNS_CADDY_AUTO_HTTPS present? $([[ -n "${CNS_CADDY_AUTO_HTTPS:-}" ]] && echo yes || echo no)"

            umask 077
            if [[ -n "${REMOTE_ENV_B64:-}" ]]; then
              if ! printf '%s' "${REMOTE_ENV_B64}" | base64 -d > .env; then
                echo "::error::Ephemeral SSH: base64 decode of REMOTE_ENV_B64 failed."
                exit 1
              fi
            else
              echo "::warning::REMOTE_ENV_B64 missing on remote; building .env on EC2 (legacy fallback)."
              SSLIP_HOST="${{ steps.tf.outputs.sslip_host }}"
              SSLIP_HOST="$(printf '%s' "${SSLIP_HOST}" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
              if [[ -z "${SSLIP_HOST}" ]]; then
                echo "::error::Ephemeral SSH bootstrap: SSLIP_HOST is empty after trim (check Terraform sslip_host output)."
                exit 1
              fi
              gen_pg_hex() {
                if command -v openssl >/dev/null 2>&1; then
                  openssl rand -hex 24
                elif command -v python3 >/dev/null 2>&1; then
                  python3 -c 'import secrets; print(secrets.token_hex(24))'
                else
                  ( set +o pipefail; LC_ALL=C tr -dc 'a-f0-9' </dev/urandom | head -c 48 )
                fi
              }
              PGP="$(gen_pg_hex)"
              if [[ -z "${PGP}" ]]; then
                echo "::error::Ephemeral SSH bootstrap: POSTGRES password material was empty after generation."
                exit 1
              fi
              CNS_ENVIRONMENT_VAL="${CNS_ENVIRONMENT:-production}"
              CNS_CONTROLLER_MODE_VAL="${CNS_CONTROLLER_MODE:-manual}"
              _def_caddy_site=':80'
              CNS_CADDY_SITE_ADDRESS_VAL="${CNS_CADDY_SITE_ADDRESS:-$_def_caddy_site}"
              CNS_CADDY_AUTO_HTTPS_VAL="${CNS_CADDY_AUTO_HTTPS:-off}"
              CADDYFILE_SSLIP_VAL="${CADDYFILE_SSLIP:-./deploy/Caddyfile.prod}"
              {
                echo "POSTGRES_PASSWORD=${PGP}"
                echo "DATABASE_URL=postgresql://cns_user:${PGP}@postgres:5432/cloud_networking_studio"
                echo "SSLIP_HOST=${SSLIP_HOST}"
                echo "CNS_CORS_ORIGINS=https://${SSLIP_HOST},http://127.0.0.1,http://localhost"
                echo "CNS_ENVIRONMENT=${CNS_ENVIRONMENT_VAL}"
                echo "CNS_CONTROLLER_MODE=${CNS_CONTROLLER_MODE_VAL}"
                echo "CNS_CADDY_SITE_ADDRESS=${CNS_CADDY_SITE_ADDRESS_VAL}"
                echo "CNS_CADDY_AUTO_HTTPS=${CNS_CADDY_AUTO_HTTPS_VAL}"
                echo "CADDYFILE_SSLIP=${CADDYFILE_SSLIP_VAL}"
              } > .env
              unset PGP || true
            fi
            echo "=== .env written ==="
            cut -d= -f1 .env

            unset TOKEN CLONE_URL REMOTE_ENV_B64 || true
            set -x

            echo "=== docker compose config ==="
            if ! "${COMPOSE[@]}" "${C_ARGS[@]}" config; then
              echo "=== docker compose ps (after failed config) ==="
              "${COMPOSE[@]}" "${C_ARGS[@]}" ps -a || true
              echo "=== docker compose logs (after failed config, tail=120) ==="
              "${COMPOSE[@]}" "${C_ARGS[@]}" logs --tail=120 || true
              exit 1
            fi

            echo "=== docker compose down ==="
            "${COMPOSE[@]}" "${C_ARGS[@]}" down || true

            echo "=== docker compose up -d --build ==="
            if ! "${COMPOSE[@]}" "${C_ARGS[@]}" up -d --build; then
              echo "=== docker compose ps (after failed up) ==="
              "${COMPOSE[@]}" "${C_ARGS[@]}" ps -a || true
              echo "=== docker compose logs (after failed up, tail=120) ==="
              "${COMPOSE[@]}" "${C_ARGS[@]}" logs --tail=120 || true
              exit 1
            fi

            echo "=== docker compose ps ==="
            "${COMPOSE[@]}" "${C_ARGS[@]}" ps -a

      - name: Smoke tests (HTTP sslip)
        env:
          CNS_BASE_URL: ${{ steps.tf.outputs.stack_base_url_sslip_http }}
          CNS_WAIT_ATTEMPTS: "90"
        run: bash scripts/prod_smoke_test.sh

      - name: Optional heavy smoke (Docker socket on EC2)
        continue-on-error: true
        env:
          CNS_BASE_URL: ${{ steps.tf.outputs.stack_base_url_sslip_http }}
          CNS_WAIT_ATTEMPTS: "30"
          CNS_HEAVY_SMOKE: "1"
        run: bash scripts/prod_smoke_test.sh --heavy

      - name: Terraform destroy infrastructure
        if: always()
        working-directory: infra/terraform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
          TF_VAR_project_name: cns
          TF_VAR_environment: ephemeral-${{ github.run_id }}
          TF_VAR_key_name: ${{ secrets.TF_VAR_KEY_NAME }}
          # GitHub-hosted runners use dynamic egress IPs; SSH SG must allow 0.0.0.0/0 for ephemeral CI (see docs/EPHEMERAL_CI_ENVIRONMENTS.md).
          TF_VAR_ssh_allowed_cidr: "0.0.0.0/0"
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_STATE_DYNAMODB_TABLE: ${{ secrets.TF_STATE_DYNAMODB_TABLE }}
          TF_CLI_ARGS_init: "-backend-config=backend.ci.hcl"
        run: |
          # Terraform commands must stay in this single block so backend init is guaranteed before plan/apply.
          set -euxo pipefail
          if [[ -z "${TF_STATE_BUCKET:-}" ]]; then
            echo "::error::TF_STATE_BUCKET unset; cannot init S3 backend for destroy."
            exit 1
          fi
          KEY="cloud-networking-studio/ephemeral/${GITHUB_RUN_ID}/terraform.tfstate"
          {
            echo "bucket  = \"${TF_STATE_BUCKET}\""
            echo "key     = \"${KEY}\""
            echo "region  = \"${AWS_REGION}\""
            echo "encrypt = true"
          } > backend.ci.hcl
          if [[ -n "${TF_STATE_DYNAMODB_TABLE:-}" ]]; then
            echo "dynamodb_table = \"${TF_STATE_DYNAMODB_TABLE}\"" >> backend.ci.hcl
          fi
          rm -rf .terraform
          terraform init -input=false -reconfigure
          terraform destroy -input=false -auto-approve
