---
# Install Docker Engine + Compose v2 plugin from the official Docker apt repository.
- name: Install Docker Engine and Compose plugin
  hosts: cns_runtime
  become: true
  vars:
    docker_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"
    docker_packages:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
  tasks:
    - name: Install apt prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: true
      when: ansible_os_family == "Debian"

    - name: Remove conflicting Ubuntu docker.io package if present
      ansible.builtin.apt:
        name: docker.io
        state: absent
        purge: true
      when: ansible_os_family == "Debian"
      failed_when: false

    - name: Ensure apt keyrings directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"
      when: ansible_os_family == "Debian"

    - name: Download Docker apt GPG key
      ansible.builtin.get_url:
        url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"
      when: ansible_os_family == "Debian"

    - name: Add Docker apt repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ docker_arch }} signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/{{ ansible_distribution | lower }}
          {{ ansible_distribution_release }} stable
        state: present
        filename: docker
      when: ansible_os_family == "Debian"

    - name: Install Docker Engine and plugins from Docker apt repository
      ansible.builtin.apt:
        name: "{{ docker_packages }}"
        state: present
        update_cache: true
      when: ansible_os_family == "Debian"

    - name: Ensure docker service is enabled and running
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Add SSH user to docker group for non-sudo access
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true

    - name: Resolve docker binary path
      ansible.builtin.command: which docker
      register: docker_bin
      changed_when: false
      failed_when: false

    - name: Resolve docker compose plugin path
      ansible.builtin.shell: |
        set -e
        for candidate in \
          /usr/libexec/docker/cli-plugins/docker-compose \
          /usr/local/lib/docker/cli-plugins/docker-compose; do
          if test -x "$candidate"; then
            readlink -f "$candidate"
            exit 0
          fi
        done
        exit 1
      register: compose_plugin_bin
      changed_when: false
      failed_when: false

    - name: Verify docker as SSH user
      ansible.builtin.command: docker --version
      register: docker_version_user
      become: false
      changed_when: false
      failed_when: false

    - name: Verify docker compose as SSH user
      ansible.builtin.shell: docker compose version
      register: compose_version_user
      become: false
      changed_when: false
      failed_when: false

    - name: Verify docker with sudo fallback
      ansible.builtin.shell: sudo docker --version
      register: docker_version_sudo
      become: false
      changed_when: false
      failed_when: false
      when: docker_version_user.rc != 0

    - name: Verify docker compose with sudo fallback
      ansible.builtin.shell: sudo docker compose version
      register: compose_version_sudo
      become: false
      changed_when: false
      failed_when: false
      when: compose_version_user.rc != 0

    - name: Log Docker install summary
      ansible.builtin.debug:
        msg:
          - "docker binary: {{ docker_bin.stdout | default('unknown') }}"
          - "compose plugin: {{ compose_plugin_bin.stdout | default('not found') }}"
          - "docker version (user): {{ docker_version_user.stdout | default('failed') }}"
          - "docker compose version (user): {{ compose_version_user.stdout | default('failed') }}"
          - "docker version (sudo): {{ docker_version_sudo.stdout | default('not needed') }}"
          - "docker compose version (sudo): {{ compose_version_sudo.stdout | default('not needed') }}"

    - name: Fail when docker compose plugin is unavailable
      ansible.builtin.fail:
        msg: >-
          docker compose plugin not available after install
          (user rc={{ compose_version_user.rc }},
          sudo rc={{ compose_version_sudo.rc | default('skipped') }})
      when:
        - compose_version_user.rc != 0
        - compose_version_sudo.rc | default(1) != 0
