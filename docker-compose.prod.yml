# Production-style stack: Postgres + API + static UI + Caddy reverse proxy.
# See docs/DEPLOYMENT.md — copy .env.example to .env and adjust secrets before exposing to the internet.
#
# Postgres is always part of this file so `docker compose -f docker-compose.prod.yml up -d` works locally
# and in CI. Host port 5433 maps to Postgres for pytest / tools on the host (see backend/tests/conftest.py).
# For AWS RDS (or any external DB), set DATABASE_URL in `.env`; the backend uses that DSN. A local
# Postgres container may still run — it is unused when DATABASE_URL points elsewhere (see docs/RDS.md).
#
# Default URL: http://localhost (port 80). API: http://localhost/api/docs
#
# The backend mounts the host Docker socket below so `runtime_target: docker` can reach the real engine.
# Remove that volume if you only need the API/UI without deploy/teardown (see docs/DEPLOYMENT.md).

name: cns-prod

networks:
  cns:
    driver: bridge

volumes:
  postgres_data:

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cloud_networking_studio}
      POSTGRES_USER: ${POSTGRES_USER:-cns_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cns_password}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [cns]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  runner:
    build:
      context: ./runner
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # docker (default) or kubernetes — use docker-compose.k8s-runtime.yml overlay for Kubernetes.
      RUNTIME_PROVIDER: ${RUNTIME_PROVIDER:-docker}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    expose:
      - "8090"
    networks: [cns]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:8090/health | grep -q '\"status\":\"ok\"'",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/cns/secrets:/opt/cns/secrets:ro
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://cns_user:cns_password@postgres:5432/cloud_networking_studio}
      CNS_ENVIRONMENT: ${CNS_ENVIRONMENT:-production}
      CNS_CONTROLLER_MODE: ${CNS_CONTROLLER_MODE:-manual}
      CNS_CORS_ORIGINS: ${CNS_CORS_ORIGINS:-http://localhost,http://127.0.0.1,http://localhost:80,http://127.0.0.1:80}
      CNS_CORS_ORIGIN_REGEX: ${CNS_CORS_ORIGIN_REGEX:-}
      CNS_REMOTE_DOCKER_SSH_KEY_PATH: ${CNS_REMOTE_DOCKER_SSH_KEY_PATH:-}
      # Step 34 auth: smoke tests expect AUTH_REQUIRE_LOGIN=true (set in CI / .env for production-like runs).
      AUTH_REQUIRE_LOGIN: ${AUTH_REQUIRE_LOGIN:-false}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-local-dev-only-change-AUTH_SECRET_KEY-in-production-min-32-chars}
      RUNTIME_EXECUTOR: ${RUNTIME_EXECUTOR:-go}
      GO_RUNNER_URL: ${GO_RUNNER_URL:-http://runner:8090}
    networks: [cns]
    depends_on:
      postgres:
        condition: service_healthy
      runner:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    restart: unless-stopped
    networks: [cns]
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/Caddyfile.prod:/etc/caddy/Caddyfile:ro
    networks: [cns]
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1/api/health | grep -q status && test -n \"$(wget -qO- http://127.0.0.1/ | head -c 1)\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 20s
