# Production-style stack: Postgres + API + static UI + Caddy reverse proxy.
# See docs/DEPLOYMENT.md — copy .env.example to .env and adjust secrets before exposing to the internet.
#
# Default URL: http://localhost (port 80). API: http://localhost/api/docs
#
# Mount Docker socket on the backend if you need real `runtime_target: docker` deploys on the same host:
#   volumes:
#     - /var/run/docker.sock:/var/run/docker.sock

name: cns-prod

networks:
  cns:
    driver: bridge

volumes:
  cns_pg_data:

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cloud_networking_studio}
      POSTGRES_USER: ${POSTGRES_USER:-cns_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cns_password}
    volumes:
      - cns_pg_data:/var/lib/postgresql/data
    networks: [cns]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cns_user -d cloud_networking_studio"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://cns_user:cns_password@postgres:5432/cloud_networking_studio}
      CNS_ENVIRONMENT: ${CNS_ENVIRONMENT:-production}
      CNS_CONTROLLER_MODE: ${CNS_CONTROLLER_MODE:-manual}
      CNS_CORS_ORIGINS: ${CNS_CORS_ORIGINS:-http://localhost,http://127.0.0.1,http://localhost:80,http://127.0.0.1:80}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [cns]
    # Optional: map host Docker for real deployments (uncomment on Linux/EC2 with Docker installed).
    # volumes:
    #   - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    restart: unless-stopped
    networks: [cns]
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/Caddyfile.prod:/etc/caddy/Caddyfile:ro
    networks: [cns]
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
