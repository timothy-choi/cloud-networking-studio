# Optional overlay for docker-compose.prod.yml — public sslip.io hostname on **80** and **443**.
#
# **HTTP-only (ephemeral / CI smoke):** set in `.env`:
#   `CADDYFILE_SSLIP=./deploy/Caddyfile.prod`
#   `CNS_CADDY_AUTO_HTTPS=off`
#   `CNS_CADDY_SITE_ADDRESS=:80`
#
# **HTTPS + sslip.io (labs):** `CADDYFILE_SSLIP=./deploy/Caddyfile.sslip`, `CNS_CADDY_AUTO_HTTPS=on`,
# `CNS_CADDY_SITE_ADDRESS=<EIP>.sslip.io`, **`SSLIP_HOST` / `CNS_SSLIP_HOST`** the same hostname.
# ACME state persists in **caddy_data** / **caddy_config**.
#
# Production **`main`** uses **`docker-compose.caddy-https.yml`** + **`deploy/Caddyfile.public-https`** (custom API domain), not this file.
#
# Usage on EC2 (after setting SSLIP_HOST in .env, e.g. SSLIP_HOST=203.0.113.7.sslip.io):
#   docker compose -f docker-compose.prod.yml -f docker-compose.sslip.yml up -d --build

volumes:
  caddy_data:
  caddy_config:

services:
  caddy:
    ports:
      - "80:80"
      - "443:443"
    environment:
      SSLIP_HOST: ${SSLIP_HOST:?Set SSLIP_HOST to your EIP sslip hostname, e.g. 203.0.113.7.sslip.io}
      # Same hostname as SSLIP_HOST; Caddyfile.sslip uses {$CNS_SSLIP_HOST} for the TLS site.
      CNS_SSLIP_HOST: ${SSLIP_HOST:?Set SSLIP_HOST to your EIP sslip hostname, e.g. 203.0.113.7.sslip.io}
      CNS_CADDY_AUTO_HTTPS: ${CNS_CADDY_AUTO_HTTPS:-on}
    volumes:
      - ${CADDYFILE_SSLIP:-./deploy/Caddyfile.sslip}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -qO- --header=Host:$${SSLIP_HOST} http://127.0.0.1/api/health | grep -q status
          && test -n "$$(wget -qO- --header=Host:$${SSLIP_HOST} http://127.0.0.1/ | head -c 1)"
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 45s
