# Optional overlay for docker-compose.prod.yml — public HTTPS on https://<EIP>.sslip.io
# (Let's Encrypt via Caddy) while keeping plain HTTP on :80 for localhost / direct IP access.
#
# Usage on EC2 (after setting SSLIP_HOST in .env, e.g. SSLIP_HOST=203.0.113.7.sslip.io):
#   docker compose -f docker-compose.prod.yml -f docker-compose.sslip.yml up -d --build
#
# Without this file, the default Caddyfile.prod (:80 only) is unchanged.

services:
  caddy:
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "443:443"
    environment:
      SSLIP_HOST: ${SSLIP_HOST:?Set SSLIP_HOST to your EIP sslip hostname, e.g. 203.0.113.7.sslip.io}
    volumes:
      - ./deploy/Caddyfile.sslip:/etc/caddy/Caddyfile:ro
