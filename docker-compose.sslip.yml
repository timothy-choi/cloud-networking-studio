# Optional overlay for docker-compose.prod.yml — public sslip.io hostname on **:80** (and **:443** published).
#
# **HTTP-only (recommended for CI / production smoke until sslip HTTPS is reliable):** set in `.env`:
#   `CADDYFILE_SSLIP=./deploy/Caddyfile.prod`
#   `CNS_CADDY_AUTO_HTTPS=off`
#   `CNS_CADDY_SITE_ADDRESS=:80`   (documentation / operator parity with ephemeral deploy)
# Caddy then serves **only** the `:80` block from **Caddyfile.prod** — **no** `{$CNS_SSLIP_HOST}` TLS site, so **no**
# automatic HTTP→HTTPS redirect (avoids **308 → tlsv1 alert internal error** on broken ACME).
#
# **HTTPS (Let's Encrypt):** default **`CADDYFILE_SSLIP=./deploy/Caddyfile.sslip`** adds TLS site **`{$CNS_SSLIP_HOST}`** on **:443**.
#
# Usage on EC2 (after setting SSLIP_HOST in .env, e.g. SSLIP_HOST=203.0.113.7.sslip.io):
#   docker compose -f docker-compose.prod.yml -f docker-compose.sslip.yml up -d --build

services:
  caddy:
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "443:443"
    environment:
      SSLIP_HOST: ${SSLIP_HOST:?Set SSLIP_HOST to your EIP sslip hostname, e.g. 203.0.113.7.sslip.io}
      # Same hostname as SSLIP_HOST; Caddyfile.sslip uses {$CNS_SSLIP_HOST} for the HTTPS site block.
      CNS_SSLIP_HOST: ${SSLIP_HOST:?Set SSLIP_HOST to your EIP sslip hostname, e.g. 203.0.113.7.sslip.io}
      CNS_CADDY_AUTO_HTTPS: ${CNS_CADDY_AUTO_HTTPS:-on}
    volumes:
      - ${CADDYFILE_SSLIP:-./deploy/Caddyfile.sslip}:/etc/caddy/Caddyfile:ro
