# Staging overlay (Step 55) — isolated from production (`cns-prod`).
#
# Usage on EC2:
#   docker compose -f docker-compose.prod.yml -f docker-compose.caddy-https.yml \
#     -f docker-compose.staging.yml --env-file .env.staging up -d --build
#
# Containers/volumes/networks use project name **cns-staging** (never cns-prod).
# Staging always uses the local Compose Postgres service unless STAGING_DATABASE_URL is set explicitly.

name: cns-staging

services:
  postgres:
    ports:
      - "${CNS_STAGING_POSTGRES_HOST_PORT:-5434}:5432"

  backend:
    environment:
      CNS_ENVIRONMENT: ${CNS_ENVIRONMENT:-staging}
      CNS_FRONTEND_APP_URL: ${CNS_FRONTEND_APP_URL:-https://app-staging.cloudnetstudio.com}
      CNS_REMOTE_DOCKER_SSH_KEY_PATH: ${CNS_REMOTE_DOCKER_SSH_KEY_PATH:-/opt/cns/secrets/gcp-remote-docker-key}

  caddy:
    ports:
      - "${CNS_STAGING_CADDY_HTTP_PORT:-80}:80"
      - "${CNS_STAGING_CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ${CADDYFILE_CADDY:-./deploy/Caddyfile.staging-https}:/etc/caddy/Caddyfile:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -qO- --header=Host:$${SSLIP_HOST} http://127.0.0.1/api/health | grep -q staging
          && test -n "$$(wget -qO- --header=Host:$${SSLIP_HOST} http://127.0.0.1/ | head -c 1)"
