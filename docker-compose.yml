version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: cns-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cloud_networking_studio
      POSTGRES_USER: cns_user
      POSTGRES_PASSWORD: cns_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: